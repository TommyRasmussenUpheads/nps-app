services:
  nps-app:
    build: .
    ports:
      - "3003:3003"
    volumes:
      - nps-data:/data
    environment:
      PORT: 3003

      # JWT - bytt til en lang tilfeldig streng!
      JWT_SECRET: bytt-meg-til-noe-hemmelig-og-langt

      # Standardbruker (opprettes kun ved første oppstart)
      ADMIN_USER: admin
      ADMIN_PASS: admin123

      # --- Standardverdier for innstillinger ---
      # Disse brukes KUN ved første oppstart.
      # Etter det endres innstillinger via ⚙️-knappen i appen.

      # SMTP2GO
      SMTP_HOST: mail.smtp2go.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ditt-smtp2go-brukernavn
      SMTP_PASS: ditt-smtp2go-passord

      # Avsender
      FROM_EMAIL: nps@skydotten.no
      FROM_NAME: NPS Kundeundersøkelse

      # Offentlig URL (brukes i epost-lenker)
      APP_URL: http://localhost:3003

    restart: unless-stopped

volumes:
  nps-data:
